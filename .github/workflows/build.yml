name: Build Kivy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip build-essential cmake \
          autoconf automake libtool libtool-bin libltdl-dev pkg-config \
          libffi-dev libssl-dev zlib1g-dev libncurses-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip buildozer cython==0.29.37 pexpect

    - name: Prepare Android SDK and Symlinks for Buildozer
      run: |
        ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools/latest

        # Descargar herramientas de línea de comandos
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_extracted
        mv /tmp/cmdtools_extracted/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
        rm -rf /tmp/cmdtools.zip /tmp/cmdtools_extracted

        # Enlaces para Buildozer
        mkdir -p $ANDROID_HOME/tools/bin
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager $ANDROID_HOME/tools/bin/avdmanager

        # Aceptar licencias
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Clean Stale Build Artifacts
      run: |
        rm -rf .buildozer/android/platform/build-*

    - name: Build APK with Buildozer
      run: |
        # Limpiar flags del sistema operativo host para forzar el uso exclusivo del NDK
        unset CFLAGS LDFLAGS CC CXX
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: votafacil-apk
        path: bin/*.apk
