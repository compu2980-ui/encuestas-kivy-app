name: Build Kivy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip build-essential cmake \
          autoconf automake libtool libtool-bin libltdl-dev pkg-config \
          libffi-dev libssl-dev zlib1g-dev libncurses-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

    - name: Install Buildozer, Cython, and p4a from Source
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.37 pexpect
        pip install --upgrade git+https://github.com/kivy/buildozer.git
        pip install --upgrade git+https://github.com/kivy/python-for-android.git

    - name: Prepare Android SDK and Symlinks for Buildozer
      run: |
        ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools/latest

        # Descargar herramientas de línea de comandos de Android
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_extracted
        mv /tmp/cmdtools_extracted/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
        rm -rf /tmp/cmdtools.zip /tmp/cmdtools_extracted

        # Crear enlaces necesarios para Buildozer
        mkdir -p $ANDROID_HOME/tools/bin
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager $ANDROID_HOME/tools/bin/avdmanager

        # Aceptar licencias automáticamente
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Clean Stale Build Artifacts
      run: |
        rm -rf .buildozer/android/platform/build-*

    - name: Build APK with Buildozer
      run: |
        # Forzar a charset-normalizer a usar modo Python puro (evita que intente compilar extensiones C)
        export CHARSET_NORMALIZER_BUILD_EXTENSION=0
        
        # Asegurar que el SDK esté en el PATH
        export PATH=$PATH:$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
        
        # Ejecutar buildozer dejando que p4a administre el entorno del NDK de forma limpia
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: votafacil-apk
        path: bin/*.apk
